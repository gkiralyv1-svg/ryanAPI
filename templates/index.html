<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryanair Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell">
        <div class="card">
            <div class="card-header">
                <div class="airplane-icon" aria-hidden="true">✈</div>
                <h1>Ryanair Finder</h1>
                <p class="subtitle">Keress olcsó járatokat a Ryanair hálózatában</p>
            </div>

            <form method="POST" action="/search">
                <div class="field-group">
                    <label for="origin">Indulás:</label>
                    <select id="origin" name="origin">
                        {% for city in cities %}
                            <option value="{{ city }}">{{ city|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field-group">
                    <label for="destination">Érkezés:</label>
                    <select id="destination" name="destination">
                        {% for city in cities %}
                            <option value="{{ city }}">{{ city|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field-group">
                    <label for="month">Hónap:</label>
                    <select id="month" name="month">
                        <option value="2026-10">2026-10</option>
                        <option value="2026-11">2026-11</option>
                        <option value="2026-12">2026-12</option>
                    </select>
                </div>

                <button type="submit">Keresés</button>
            </form>
        </div>
    </div>
</body>
</html>
